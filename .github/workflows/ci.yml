
name: Food Analytics CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python applications
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure environment variables
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE/ai_service" >> "$GITHUB_ENV"
          echo "HF_HOME=$RUNNER_TEMP/huggingface" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ai_service/requirements.txt
            streamlit_app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r ai_service/requirements.txt \
            -r streamlit_app/requirements.txt \
            pytest

      - name: Run backend and UI tests
        run: |
          python -m pytest \
            ai_service/tests \
            streamlit_app/tests \
            -v
